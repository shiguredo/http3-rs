name: CI

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  ci:
    name: CI
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: ${{ matrix.os }}
          toolchain: stable
      - run: cargo fmt --all --check
      # interop/h3 / interop/wt は専用ステップでのみ実行する。
      # また tokio-ngtcp2 は POSIX ソケット型に依存する shiguredo_ngtcp2_tokio を
      # 使用するため Windows では除外する。
      - name: Set excluded crates
        id: excludes
        shell: bash
        run: |
          EXCLUDES="--exclude interop_h3 --exclude interop_wt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXCLUDES="$EXCLUDES --exclude tokio-ngtcp2"
          fi
          echo "flags=$EXCLUDES" >> "$GITHUB_OUTPUT"
      - run: cargo clippy --workspace ${{ steps.excludes.outputs.flags }} -- -D warnings
      - run: cargo test --workspace ${{ steps.excludes.outputs.flags }}
      # interop/h3 / interop/wt は quiche (BoringSSL) と neqo (NSS) のシンボル衝突により
      # Linux ではリンクに失敗するため macOS でのみテストする
      - name: Run interop tests
        if: runner.os == 'macOS'
        run: make interop-test
      # 実ブラウザ (Chromium / WebKit) から wt_server へ接続できることを確認する。
      # WebKit は Safari 相当であり、Safari 固有の SETTINGS 制約を検証できる。
      # ブラウザは macOS でのみ導入できるため macOS でのみ実行する。
      - name: Set up Node.js
        if: runner.os == 'macOS'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Playwright browsers
        if: runner.os == 'macOS'
        run: |
          npm ci --prefix interop/browser
          npx --prefix interop/browser playwright install chromium webkit
      - name: Build WebTransport server
        if: runner.os == 'macOS'
        run: cargo build --manifest-path examples/wt_server/Cargo.toml
      - name: Run browser WebTransport interop tests
        if: runner.os == 'macOS'
        run: node interop/browser/run.mjs
        env:
          # Playwright 未導入を失敗として扱う (skip で CI が緑になるのを防ぐ)
          WT_FORCE: "1"

  slack_notify:
    needs: [ci]
    runs-on: ubuntu-slim
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_channel: rust-oss
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
