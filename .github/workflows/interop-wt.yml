name: Interop WebTransport

on:
  schedule:
    # 平日 JST 11:00 (UTC 02:00) に実行する
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

jobs:
  interop-wt:
    name: Interop WebTransport (ngtcp2 x s2n-quic)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: macos-26
          toolchain: stable
      # ngtcp2/nghttp3 と s2n-quic の組み合わせのみを実行する
      - name: Run WebTransport interop tests (ngtcp2 x s2n-quic)
        run: |
          cargo test --manifest-path interop/wt/Cargo.toml --test ngtcp2_client_s2n_server
          cargo test --manifest-path interop/wt/Cargo.toml --test s2n_client_ngtcp2_server
      # 実ブラウザ (Chromium / WebKit) から wt_server へ接続できることを確認する。
      # WebKit は Safari 相当であり、Safari 固有の SETTINGS 制約を検証できる。
      - name: Install Playwright browsers
        run: |
          npm ci --prefix interop/browser
          npx --prefix interop/browser playwright install chromium webkit
      - name: Build WebTransport server
        run: cargo build --manifest-path examples/wt_server/Cargo.toml
      - name: Run browser WebTransport interop tests
        run: node interop/browser/run.mjs
        env:
          # Playwright 未導入を失敗として扱う (skip で CI が緑になるのを防ぐ)
          WT_FORCE: "1"

  slack_notify:
    needs: [interop-wt]
    runs-on: ubuntu-slim
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_channel: rust-oss
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
