[package]
name = "shiguredo_http3"
version = "2026.1.0-canary.1"
edition.workspace = true
rust-version.workspace = true
description = "Sans I/O HTTP/3 Library"
readme = "README.md"
homepage = "https://github.com/shiguredo/http3-rs"
repository = "https://github.com/shiguredo/http3-rs"
license = "Apache-2.0"
include = ["/LICENSE", "/README.md", "/src/**"]

[workspace]
members = [
  "crates/nghttp3-sys",
  "crates/ngtcp2-rs",
  "crates/ngtcp2-sys",
  "crates/tokio-ngtcp2",
  "crates/tokio-s2n-quic",
  "examples/wt_server",
  "interop/h3",
  "interop/wt",
  "pbt",
]
exclude = [
  "fuzz",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[features]
# PBT / fuzz / 内部テストから `Header::from_validated_parts` などの検査バイパス API
# を利用するためのフィーチャー。通常のアプリケーションでは有効化しない。
internal-test = []

[dependencies]
