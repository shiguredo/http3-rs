[package]
name = "ngtcp2-sys"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"
links = "ngtcp2"
publish = false

# 以降は外部ライブラリビルド用のメタデータ
# (この内容は build.rs の中からのみ参照される)
[package.metadata.external-dependencies]
ngtcp2 = { git = "https://github.com/ngtcp2/ngtcp2", branch = "reliable-stream-reset" }

[lib]
doctest = false

[dependencies]
aws-lc-sys = { version = "0.43", features = ["ssl"] }
libc = "0.2"

[build-dependencies]
# overwrite feature でのみ使用 (通常ビルドでは libclang 不要)
bindgen = { version = "0.72", optional = true }
shiguredo_cmake = "4.4"
shiguredo_toml = "2026.2"

[features]
# bindings.rs を再生成するための feature
# 通常は生成済みの bindings.rs を使用し、ngtcp2 のバージョンを上げたときに再生成する
# 使用方法: cargo build -p ngtcp2-sys --features overwrite
overwrite = ["dep:bindgen"]
