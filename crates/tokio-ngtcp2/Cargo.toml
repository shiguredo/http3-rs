[package]
name = "tokio-ngtcp2"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# HTTP/3 / WebTransport の状態機械 (Sans I/O)
shiguredo_http3.workspace = true
# QUIC トランスポート (crates.io の shiguredo_ngtcp2 系)
#
# 3 クレートは同時にリリースされるため、揃ったバージョンを指定する。
# 直接使うのは shiguredo_ngtcp2_tokio (sans-IO 層は再公開経由で使う)。
shiguredo_ngtcp2_tokio = "=2026.1.0-canary.0"
tokio = { version = "1.53", features = ["full"] }

[dev-dependencies]
rcgen = "0.14"
serial_test = "4.0"
