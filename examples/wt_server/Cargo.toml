[package]
name = "wt_server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
shiguredo_http3 = { path = "../.." }
s2n-quic = { version = "1.80", default-features = false, features = ["provider-address-token-default", "provider-tls-rustls", "unstable-provider-datagram", "provider-event-tracing"] }
rustls = "0.23"
rcgen = "0.14"
base64 = "0.22"
aws-lc-rs = "1"
time = "0.3"
tokio = { version = "1", features = ["full"] }
noargs = "0.4"
nojson = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
