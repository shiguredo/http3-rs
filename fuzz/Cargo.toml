test = false
doc = false
bench = false

[[bin]]
name = "fuzz_qpack"
path = "fuzz_targets/fuzz_qpack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_capsule"
path = "fuzz_targets/fuzz_capsule.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_connection"
path = "fuzz_targets/fuzz_connection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_webtransport_session"
path = "fuzz_targets/fuzz_webtransport_session.rs"
test = false
