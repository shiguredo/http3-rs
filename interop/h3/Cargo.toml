[package]
name = "interop_h3"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bytes = "1.12"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.5"
quiche = "0.29"
quinn = { version = "0.11", default-features = false, features = [
  "runtime-tokio",
  "rustls-aws-lc-rs"
] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
  "std"
] }
rustls-pki-types = { version = "1.15", features = ["std"] }
shiguredo_http3.workspace = true
shiguredo_ngtcp2 = { path = "../../crates/shiguredo_ngtcp2" }
shiguredo_ngtcp2_tokio = { path = "../../crates/shiguredo_ngtcp2_tokio" }
tempfile = "3.27"
tokio = { version = "1.53", features = ["full"] }
tokio-quiche = "0.19"
tokio-s2n-quic = { path = "../../crates/tokio-s2n-quic" }
tquic = { version = "1.6", optional = true }

[features]
tquic-impl = ["dep:tquic"]
