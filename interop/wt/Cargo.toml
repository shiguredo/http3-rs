[package]
name = "interop_wt"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
bytes = "1.11"
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"
http = "1.4"
quinn = {
  version = "0.11",
  default-features = false,
  features = ["runtime-tokio", "rustls-aws-lc-rs"]
}
rcgen = "0.14"
rustls = {
  version = "0.23",
  default-features = false,
  features = ["aws_lc_rs", "std"]
}
rustls-pki-types = { version = "1.14", features = ["std"] }
shiguredo_http3.workspace = true
shiguredo_ngtcp2 = { path = "../../crates/ngtcp2-rs" }
tempfile = "3.27"
tokio = { version = "1.52", features = ["full"] }
tokio-ngtcp2 = { path = "../../crates/tokio-ngtcp2" }
tokio-s2n-quic = { path = "../../crates/tokio-s2n-quic" }

[dev-dependencies]
serial_test = "3.4"
