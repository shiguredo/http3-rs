[package]
name = "interop_wt"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
shiguredo_http3 = { path = ".." }
tokio-s2n-quic = { path = "../crates/tokio-s2n-quic" }
shiguredo_ngtcp2 = { path = "../crates/shiguredo_ngtcp2" }
tokio-ngtcp2 = { path = "../crates/tokio-ngtcp2" }
tokio = { version = "1", features = ["full"] }
rcgen = "0.14"
tempfile = "3"
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
http = "1"
bytes = "1"

[dev-dependencies]
serial_test = "3"

[lib]
path = "src/lib.rs"
