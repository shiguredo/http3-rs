# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

exclude = { glob = ["target/**"] }

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all -- --check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 10,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    entry = "cargo clippy --workspace --all-targets -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 20,
  },
  {
    id = "interop-test",
    name = "make interop-test",
    entry = "make interop-test",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 30,
  },
]
